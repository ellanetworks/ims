openapi: "3.1.0"
info:
  title: Ella IMS API
  version: "1.0.0"
  description: |
    Success: `{"result": <payload>}`. Error: `{"error": "message"}`.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5020

security: []

tags:
  - name: Operator
  - name: Diameter
  - name: Policy
  - name: SIP
  - name: Registrations
  - name: Call records
  - name: MCPTT service configuration
  - name: MCPTT users
  - name: MCPTT groups
  - name: MCPTT live state
  - name: Status
  - name: Metrics
  - name: Specification

paths:
  /api/v1/operator:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Get the operator
      responses:
        "200":
          description: The operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResult"
    put:
      tags: [Operator]
      operationId: updateOperator
      summary: Update the operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Operator"
      responses:
        "200":
          description: The operator as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter:
    get:
      tags: [Diameter]
      operationId: getDiameter
      summary: Get the Diameter identity of the IMS
      responses:
        "200":
          description: The Diameter identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/DiameterIdentity"

  /api/v1/diameter/peers:
    get:
      tags: [Diameter]
      operationId: listDiameterPeers
      summary: List the Diameter peers
      responses:
        "200":
          description: The peers, in the order they were created in
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiameterPeer"
    post:
      tags: [Diameter]
      operationId: createDiameterPeer
      summary: Create a Diameter peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterPeerParams"
              unevaluatedProperties: false
      responses:
        "201":
          description: The peer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Diameter]
      operationId: getDiameterPeer
      summary: Get a Diameter peer
      responses:
        "200":
          description: The peer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterPeer
      summary: Update a Diameter peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterPeerParams"
              unevaluatedProperties: false
      responses:
        "200":
          description: The peer as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Diameter]
      operationId: deleteDiameterPeer
      summary: Delete a Diameter peer
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/routes:
    get:
      tags: [Diameter]
      operationId: listDiameterRoutes
      summary: List where Cx and Rx requests go
      responses:
        "200":
          description: The routes, cx then rx
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiameterRoute"

  /api/v1/diameter/routes/{application}:
    parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          enum: [cx, rx]
    get:
      tags: [Diameter]
      operationId: getDiameterRoute
      summary: Get where an application's requests go
      responses:
        "200":
          description: The route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterRouteResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterRoute
      summary: Set the realm of an application's requests
      description: The next request goes to the new realm, through the peers serving the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterRouteParams"
              unevaluatedProperties: false
      responses:
        "200":
          description: The route as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterRouteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policy:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: Get the policy function of the P-CSCF
      responses:
        "200":
          description: The policy function, and the one running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResult"
    put:
      tags: [Policy]
      operationId: updatePolicy
      summary: Update the policy function of the P-CSCF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
              unevaluatedProperties: false
      responses:
        "200":
          description: The policy function as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sip:
    get:
      tags: [SIP]
      operationId: getSIP
      summary: Get the SIP names and listeners of the IMS
      responses:
        "200":
          description: The home domain, the aliases derived from it, and the listeners
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/SIPStatus"

  /api/v1/registrations:
    get:
      tags: [Registrations]
      operationId: listRegistrations
      summary: List the registrations
      parameters:
        - name: search
          in: query
          description: Substring of a private or public identity.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A page of registrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Registration"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/registrations/{impi}/reauthenticate:
    post:
      tags: [Registrations]
      operationId: reauthenticate
      summary: Re-authenticate a registered UE
      parameters:
        - name: impi
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Re-authentication started
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      impi:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The IMS is restarting to apply its settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/call-records:
    get:
      tags: [Call records]
      operationId: listCallRecords
      summary: List the call records
      description: Most recently requested first.
      parameters:
        - name: search
          in: query
          description: Substring of the ICID or of an identity of the caller or the callee.
          schema:
            type: string
        - name: start
          in: query
          description: Earliest request time, inclusive.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Latest request time, exclusive.
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          description: Outcomes to include.
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CallOutcome"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A page of call records
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CallRecord"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/call-records/{id}:
    get:
      tags: [Call records]
      operationId: getCallRecord
      summary: Get a call record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The call record
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/CallRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/call-records/retention:
    get:
      tags: [Call records]
      operationId: getCallRecordRetention
      summary: Get how long call records are kept
      responses:
        "200":
          description: The retention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecordRetentionResult"
    put:
      tags: [Call records]
      operationId: updateCallRecordRetention
      summary: Change how long call records are kept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRecordRetention"
      responses:
        "200":
          description: The retention, as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecordRetentionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/service-configuration:
    get:
      tags: [MCPTT service configuration]
      operationId: getMCPTTServiceConfiguration
      summary: Get the service configuration
      responses:
        "200":
          description: The service configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTServiceConfigurationResult"
    put:
      tags: [MCPTT service configuration]
      operationId: updateMCPTTServiceConfiguration
      summary: Replace the service configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTServiceConfiguration"
      responses:
        "200":
          description: The service configuration as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTServiceConfigurationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/users:
    get:
      tags: [MCPTT users]
      operationId: listMCPTTUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of the users
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTUser"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [MCPTT users]
      operationId: createMCPTTUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTUserCreate"
      responses:
        "201":
          description: The user as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTUserResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/users/{mcptt_id}:
    parameters:
      - $ref: "#/components/parameters/MCPTTID"
    get:
      tags: [MCPTT users]
      operationId: getMCPTTUser
      summary: Get a user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTUserResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [MCPTT users]
      operationId: updateMCPTTUser
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTUserInput"
      responses:
        "200":
          description: The user as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTUserResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [MCPTT users]
      operationId: deleteMCPTTUser
      summary: Delete a user
      description: The user leaves its groups; a group it leaves that would be invalid without it is a conflict.
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/groups:
    get:
      tags: [MCPTT groups]
      operationId: listMCPTTGroups
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of the groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTGroup"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [MCPTT groups]
      operationId: createMCPTTGroup
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTGroupCreate"
      responses:
        "201":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/MCPTTGroupID"
    get:
      tags: [MCPTT groups]
      operationId: getMCPTTGroup
      summary: Get a group
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [MCPTT groups]
      operationId: updateMCPTTGroup
      summary: Replace a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTGroupInput"
      responses:
        "200":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [MCPTT groups]
      operationId: deleteMCPTTGroup
      summary: Delete a group
      description: The group goes from the implicit affiliations of its users.
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/groups/{group_id}/members/{mcptt_id}:
    parameters:
      - $ref: "#/components/parameters/MCPTTGroupID"
      - $ref: "#/components/parameters/MCPTTID"
    put:
      tags: [MCPTT groups]
      operationId: putMCPTTMember
      summary: Add or replace a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTMemberInput"
      responses:
        "200":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "201":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [MCPTT groups]
      operationId: deleteMCPTTMember
      summary: Remove a member
      description: The group goes from the user's implicit affiliations.
      responses:
        "200":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/registrations:
    get:
      tags: [MCPTT live state]
      operationId: listMCPTTRegistrations
      summary: List the registered clients
      description: The MCPTT clients bound to their users by service authorisation, by MCPTT ID and client ID; of the user of mcptt_id if given.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: mcptt_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of them
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTRegistration"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mcptt/affiliations:
    get:
      tags: [MCPTT live state]
      operationId: listMCPTTAffiliations
      summary: List the affiliations
      description: The affiliations of the clients to groups, by group, MCPTT ID and client ID; of the user of mcptt_id and the group of group_id if given.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: mcptt_id
          in: query
          schema:
            type: string
        - name: group_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of them
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTAffiliation"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mcptt/calls:
    get:
      tags: [MCPTT live state]
      operationId: listMCPTTCalls
      summary: List the group calls
      description: The group calls, oldest first; of the group of group_id, with the participant of mcptt_id, if given.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: mcptt_id
          in: query
          schema:
            type: string
        - name: group_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of them
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTCall"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mcptt/calls/{call_id}:
    parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [MCPTT live state]
      operationId: getMCPTTCall
      summary: Get a group call
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/MCPTTCall"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Get the status of the IMS
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [version, revision]
                    properties:
                      version:
                        type: string
                        examples: [v0.0.1]
                      revision:
                        type: string
                        description: Git commit of the build, empty in development builds.
                      mcptt:
                        $ref: "#/components/schemas/MCPTTStatus"
                        description: What the MCPTT AS runs, absent if the IMS runs none.

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Get the metrics of the IMS in the Prometheus formats
      responses:
        "200":
          description: The metrics, in the format the request's Accept header negotiates
          content:
            text/plain:
              schema:
                type: string

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      summary: Get this specification
      responses:
        "200":
          description: The specification
          content:
            application/openapi+yaml: {}

components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MCPTTID:
      name: mcptt_id
      in: path
      required: true
      schema:
        type: string
        examples: ["sip:alice@mcptt.example.com"]
    MCPTTGroupID:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        examples: ["sip:fire@mcptt.example.com"]

  schemas:
    Operator:
      type: object
      additionalProperties: false
      required: [mcc, mnc, numbering]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
        numbering:
          $ref: "#/components/schemas/Numbering"

    Numbering:
      type: object
      additionalProperties: false
      required: [country_code, national_prefix, international_prefix]
      description: Conversion of dial strings to E.164 numbers.
      properties:
        country_code:
          type: string
          pattern: "^[1-9][0-9]{0,2}$"
        national_prefix:
          type: string
          pattern: "^[0-9]{0,4}$"
        international_prefix:
          type: string
          pattern: "^[0-9]{0,4}$"

    OperatorResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Operator"

    DiameterIdentity:
      type: object
      required: [host, realm]
      properties:
        host:
          type: string
          examples: [ims.ims.mnc001.mcc001.3gppnetwork.org]
        realm:
          type: string
          examples: [ims.mnc001.mcc001.3gppnetwork.org]

    DiameterPeerParams:
      type: object
      required: [address, applications]
      properties:
        host:
          type: string
          description: >-
            The DiameterIdentity of the peer, which must then match the Origin-Host of its capabilities exchange.
            Absent or empty takes the Origin-Host the peer gives.
        address:
          type: string
          description: An IPv4 or IPv6 address.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 3868
        transport:
          type: string
          enum: [tcp, sctp]
          default: tcp
        applications:
          type: array
          minItems: 1
          uniqueItems: true
          description: cx for an HSS or an SLF, rx for a PCRF or a DRA.
          items:
            type: string
            enum: [cx, rx]
        priority:
          type: integer
          minimum: 0
          maximum: 65535
          default: 10
          description: >-
            Requests try the peers serving their application by priority, lowest first, and share them between
            peers of the same priority. HSSs of the same priority must share their state, as the nodes of a
            replicated HSS do.

    DiameterPeer:
      allOf:
        - $ref: "#/components/schemas/DiameterPeerParams"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
              description: A UUIDv7.
            status:
              $ref: "#/components/schemas/DiameterPeerStatus"

    DiameterPeerStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [down, connecting, open, suspect, reopen, closing]
        since:
          type: string
          format: date-time
        remote_address:
          type: string
        host:
          type: string
          description: The Origin-Host the peer gave in its last capabilities exchange, else the configured host.
        realm:
          type: string
          description: The realm the peer gave in its last capabilities exchange.
        error:
          type: string
          description: Why the last connection to the peer failed.

    DiameterPeerResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DiameterPeer"

    DiameterRouteParams:
      type: object
      properties:
        realm:
          type: string
          description: The realm of the HSS for cx, of the PCRF for rx. Absent or empty is the home domain.
          examples: [epc.mnc001.mcc001.3gppnetwork.org]

    DiameterRoute:
      allOf:
        - $ref: "#/components/schemas/DiameterRouteParams"
        - type: object
          required: [application, realm, destination_realm, peers]
          properties:
            application:
              type: string
              enum: [cx, rx]
            destination_realm:
              type: string
              description: The Destination-Realm of the requests, the home domain if realm is empty.
            peers:
              type: array
              description: The peers serving the application, in the order requests try them.
              items:
                type: object
                required: [id, host, priority, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  host:
                    type: string
                  priority:
                    type: integer
                  status:
                    $ref: "#/components/schemas/DiameterPeerStatus"

    DiameterRouteResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DiameterRoute"

    Policy:
      type: object
      required: [interface]
      properties:
        interface:
          type: string
          enum: [none, rx, n5]
        n5:
          type: object
          additionalProperties: false
          description: For the n5 interface only.
          required: [pcf_uri]
          properties:
            pcf_uri:
              type: string
              description: The API root of the PCF, http[s]://host[:port][/prefix].

    PolicyResult:
      type: object
      properties:
        result:
          allOf:
            - $ref: "#/components/schemas/Policy"
            - type: object
              required: [status]
              properties:
                status:
                  type: object
                  required: [interface]
                  description: Policy function running.
                  properties:
                    interface:
                      type: string
                      enum: [none, rx, n5]
                    endpoint:
                      type: string
                    notify:
                      type: string
                    last:
                      type: object
                      description: The outcome of the last request to the PCF.
                      properties:
                        at:
                          type: string
                          format: date-time
                        reachable:
                          type: boolean
                        result:
                          type: string

    SIPStatus:
      type: object
      required: [home_domain, aliases, listeners]
      properties:
        home_domain:
          type: string
        aliases:
          type: array
          items:
            type: string
        listeners:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              address:
                type: string
              transports:
                type: array
                items:
                  type: string

    Registration:
      type: object
      required: [impi, implicit_registration_sets]
      properties:
        impi:
          type: string
          description: Private user identity.
          examples: [001010000000001@ims.mnc001.mcc001.3gppnetwork.org]
        implicit_registration_sets:
          type: array
          description: >-
            The registered implicit registration sets of the private identity. A set registers and deregisters as one
            (TS 23.228 §5.2.1a.0).
          items:
            $ref: "#/components/schemas/ImplicitRegistrationSet"

    ImplicitRegistrationSet:
      type: object
      required: [identities, contacts]
      properties:
        hss:
          type: object
          description: >-
            The HSS the S-CSCF sends the set's Cx requests to (TS 29.229 §5.5): the Origin-Host and Origin-Realm of its
            last answer. Absent while unknown.
          required: [host, realm]
          properties:
            host:
              type: string
              examples: [mmec01.mmegi0001.mme.epc.mnc001.mcc001.3gppnetwork.org]
            realm:
              type: string
              examples: [epc.mnc001.mcc001.3gppnetwork.org]
        identities:
          type: array
          description: The public user identities of the set.
          items:
            type: object
            required: [uri, barred, registered_with]
            properties:
              uri:
                type: string
                examples: [tel:+15551230001]
              display_name:
                type: string
              barred:
                type: boolean
              registered_with:
                type: array
                description: >-
                  The other private identities a request to this public identity reaches (TS 24.229 §5.4.3.3 step 8).
                items:
                  type: string
        contacts:
          type: array
          description: >-
            The unexpired contacts bound to the set. A contact bound to several sets is listed in each, with that
            binding's times.
          items:
            type: object
            required: [contact, q, media, registered_at, expires_at, protected, signalling_path]
            properties:
              contact:
                type: string
              instance:
                type: string
                description: Instance ID, an IMEI URN when available (TS 23.003 §13.8).
                examples: [urn:gsma:imei:35000000-000001-0]
              reg_id:
                type: integer
                description: The reg-id of the flow, when the contact is one of the device's flows (RFC 5626).
              q:
                type: number
                description: The q-value of the contact (RFC 3841 §7.2.3).
              media:
                type: array
                description: The media the device registered for.
                items:
                  type: string
                  enum: [audio, video]
              registered_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
              address:
                type: string
                description: Address and port of the device, as seen by the P-CSCF.
              transport:
                type: string
                enum: [udp, tcp]
              protected:
                type: boolean
                description: Whether IPsec protects the signalling of the device.
              signalling_path:
                type: string
                enum: [unmonitored, monitored, lost]
                description: State of the IMS signalling path of the device.

    CallOutcome:
      type: string
      enum: [answered, cancelled, busy, rejected, no_answer, unavailable, failed]
      description: |
        answered: 2xx. cancelled: 487 to a caller CANCEL. busy: 486, 600. rejected: 603. no_answer: 408 after a 180.
        unavailable: 480. failed: any other final status.

    CallRecord:
      type: object
      required: [id, icid, session_id, calling_party, requested_party, requested_at, alerted, media, in_progress,
        incomplete]
      properties:
        id:
          type: integer
        icid:
          type: string
          description: icid-value of the P-Charging-Vector (TS 32.298 §5.1.3.1.19).
        session_id:
          type: string
          description: Call-ID of the INVITE (§5.1.3.1.59).
        calling_party:
          type: array
          items:
            type: string
          description: P-Asserted-Identity values (§5.1.3.1.24).
        caller_impi:
          type: string
          description: Private user identity of the caller (§5.1.3.1.36).
        requested_party:
          type: string
          description: Request-URI from the caller (§5.1.3.1.43).
        called_party:
          type: string
          description: Request-URI after normalisation by the S-CSCF (§5.1.3.1.9).
        callee_impi:
          type: string
          description: Private user identity of the answering registration (§5.1.3.1.36).
        requested_at:
          type: string
          format: date-time
          description: Reception time of the INVITE (§5.1.3.1.58).
        delivery_start_at:
          type: string
          format: date-time
          description: Time of the final response to the caller (§5.1.3.1.55).
        delivery_end_at:
          type: string
          format: date-time
          description: End time of an answered call (§5.1.3.1.54).
        sip_status:
          type: integer
          description: Final status of the INVITE sent to the caller (§5.1.3.1.57).
        outcome:
          $ref: "#/components/schemas/CallOutcome"
        ended_by:
          type: string
          enum: [caller, callee, network]
        alerted:
          type: boolean
          description: A 180 reached the caller.
        media:
          type: array
          items:
            type: string
          description: Media types of the accepted m-lines.
        in_progress:
          type: boolean
          description: The call has not ended.
        incomplete:
          type: boolean
          description: Closed without the end of the call.
        duration_ms:
          type: integer
          description: Duration of an answered call that ended, in milliseconds.

    CallRecordRetention:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650

    CallRecordRetentionResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CallRecordRetention"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MCPTTServiceConfiguration:
      type: object
      description: >-
        The service configuration of the organisation (TS 24.484 §8.4) that an operator sets. The server fixes the
        rest: the floor control timers and counters to the defaults of TS 24.380 Table 11.1.3-1 and Table 11.2.3-1, T7
        (Floor Idle) to 2 s, 4 priority levels.
      required: [domain]
      properties:
        domain:
          type: string
          description: >-
            The domain of the organisation, of its MCPTT IDs and group IDs, and the IOI of its charging. The IMS home
            domain until set; setting the home domain makes it follow the home domain again.
          examples: [mcptt.example.com]
        transmit_time_limit_ms:
          type: integer
          minimum: 1
          description: How long a participant may talk at a time, T2 (TS 24.380 Table 11.1.3-1); 30 s if absent.
    MCPTTServiceConfigurationResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/MCPTTServiceConfiguration"

    MCPTTUserInput:
      type: object
      description: >-
        An MCPTT user (TS 24.484 §8.3) as an operator sets it. The server fixes the rest of its profile: no limit of
        affiliations (N2) nor of simultaneous calls (N6).
      required: [impus]
      properties:
        mcptt_id:
          type: string
          examples: ["sip:alice@mcptt.example.com"]
        alias:
          type: string
          maxLength: 64
          description: The user's alias (TS 24.484 §8.3.2.7), its name for people; none if empty or absent.
          examples: [Alice]
        impus:
          type: array
          items:
            type: string
          examples: [["sip:alice@ims.example.com"]]
        implicit_affiliations:
          type: array
          items:
            type: string
          examples: [["sip:fire@mcptt.example.com"]]
    MCPTTUserCreate:
      allOf:
        - $ref: "#/components/schemas/MCPTTUserInput"
        - required: [mcptt_id]
    MCPTTUser:
      allOf:
        - $ref: "#/components/schemas/MCPTTUserInput"
        - required: [mcptt_id, alias, impus, implicit_affiliations]
    MCPTTUserResult:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/MCPTTUser"

    MCPTTMemberInput:
      type: object
      description: >-
        A member of the group (TS 24.481 §7.2.2). The server fixes the rest of the entry: the lowest priority, neither
        required nor required to be affiliated.
      properties:
        mcptt_id:
          type: string
        recvonly:
          type: boolean
          description: The member may listen but not talk.
        implicit_affiliation:
          type: boolean
          description: >-
            Whether the group is one of the user's implicit affiliations (its implicit_affiliations), which the user's
            profile has, not the member. Absent from a request, it is as it was; a member removed loses it.

    MCPTTMember:
      allOf:
        - $ref: "#/components/schemas/MCPTTMemberInput"
        - required: [mcptt_id, recvonly, implicit_affiliation]

    MCPTTGroupInput:
      type: object
      description: >-
        A prearranged group (TS 24.481 §7.2) as an operator sets it, its calls of AMR-WB. The server fixes the rest of
        its document: no limit of participants, no minimum to start nor of affiliated members.
      required: [maximum_duration_ms]
      properties:
        group_id:
          type: string
          examples: ["sip:fire@mcptt.example.com"]
        display_name:
          type: string
          maxLength: 64
          description: The group name (TS 24.481 §7.2.2); none if empty or absent.
          examples: [Fire]
        hang_timer_ms:
          type: integer
          description: How long a call lasts without anyone talking, T4 (TS 24.380 Table 11.1.3-1); 30 s if absent.
        maximum_duration_ms:
          type: integer
          minimum: 1
          description: How long a call lasts at most, TNG3 (TS 24.379 §6.3.3.5).
        release_on_initiator_leave:
          type: boolean
          description: A call ends when the member that started it leaves (TS 24.379 §6.3.8.1 3).
        members:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MCPTTMemberInput"
              - required: [mcptt_id]
    MCPTTGroupCreate:
      allOf:
        - $ref: "#/components/schemas/MCPTTGroupInput"
        - required: [group_id]
    MCPTTGroup:
      allOf:
        - $ref: "#/components/schemas/MCPTTGroupInput"
        - required: [group_id, display_name, maximum_duration_ms, release_on_initiator_leave, members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/MCPTTMember"
    MCPTTGroupResult:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/MCPTTGroup"

    MCPTTRegistration:
      type: object
      required: [mcptt_id, client_id, impu, impus, since, expires_at, contacts]
      properties:
        mcptt_id:
          type: string
        client_id:
          type: string
          description: The MCPTT client ID (TS 24.379 §4.10).
        impu:
          type: string
          description: The IMS public user identity the client registered at.
        impus:
          type: array
          description: The public user identities it is served at, impu first.
          items:
            type: string
        since:
          type: string
          format: date-time
          description: When the client was authorised for the user, kept by the refreshes.
        expires_at:
          type: string
          format: date-time
        contacts:
          type: array
          description: The contacts the client registered, in direct mode; none through the IMS.
          items:
            type: string

    MCPTTAffiliation:
      type: object
      required: [mcptt_id, client_id, group_id, status, configured_implicit]
      properties:
        mcptt_id:
          type: string
        client_id:
          type: string
        group_id:
          type: string
        status:
          type: string
          enum: [affiliating, affiliated, deaffiliating]
          description: >-
            The affiliation status at the participating function (TS 24.379 §9.2.2.2.2). Affiliating and affiliated
            count as affiliated, deaffiliating does not (§9.2.2.2.11 3a). Group calls invite the members the
            controlling function holds affiliated (§9.2.2.3.2), which can trail or lead this status around a PUBLISH.
        configured_implicit:
          type: boolean
          description: >-
            The group is one of the user's implicit affiliations in the current settings (TS 24.484 §8.3.2.7), not
            how the client was affiliated. The server affiliates a client to them at its service authorisation only
            (TS 24.379 §9.2.2.2.15): a change of the setting applies from the client's next registration, and
            clearing it de-affiliates no one.

    MCPTTCall:
      type: object
      required: [id, session_id, group_id, originator, created_at, started_at, ends_at, talker, participants]
      properties:
        id:
          type: string
          description: The "gr" of the MCPTT session identity, which names the call.
        session_id:
          type: string
          description: The MCPTT session identity (TS 24.379 §4.5).
        group_id:
          type: string
        originator:
          type: string
          description: The MCPTT ID of the member that started the call.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the originator was answered; null while the call is set up.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: When the call's maximum duration (TNG3) releases it.
        talker:
          oneOf:
            - type: "null"
            - type: object
              required: [mcptt_id, since]
              properties:
                mcptt_id:
                  type: string
                since:
                  type: string
                  format: date-time
          description: The participant with the floor, null if the floor is idle.
        participants:
          type: array
          description: The members invited and joined, the originator first.
          items:
            type: object
            required: [mcptt_id, state, required, recvonly]
            properties:
              mcptt_id:
                type: string
              state:
                type: string
                enum: [invited, joined]
              required:
                type: boolean
              recvonly:
                type: boolean

    MCPTTStatus:
      type: object
      required: [mode, name, participating_psi, controlling_psi, sip, media_control]
      properties:
        mode:
          type: string
          enum: [ims, direct]
        name:
          type: string
          description: The server name of the AS in the iFCs of the HSS, of the home domain.
          examples: ["sip:mcptt.ims.mnc001.mcc001.3gppnetwork.org"]
        participating_psi:
          type: string
          examples: ["sip:mcptt-participating@mcptt.ims.mnc001.mcc001.3gppnetwork.org"]
        controlling_psi:
          type: string
          examples: ["sip:mcptt-controlling@mcptt.ims.mnc001.mcc001.3gppnetwork.org"]
        sip:
          type: array
          items:
            type: string
        media_control:
          type: string

  responses:
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: object
                properties:
                  message:
                    type: string
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with other settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The MCPTT AS is restarting or busy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
