  /api/v1/users/{email}/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteUserAPIToken
      summary: Delete an API token of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access token from POST /api/v1/auth/login, or an API token, which starts with ellaims_. An access token
        ends with its session. An API token cannot create API tokens, change a password, or manage users: those
        operations answer 403 to it.
    SessionCookie:
      type: apiKey
      in: cookie
      name: ims_session
      description: >-
        The session that a login or the initialization starts, for POST /api/v1/auth/refresh. Over TLS, the cookie is
        __Host-ims_session.

  parameters:
    Email:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
    APITokenID:
      name: id
      in: path
      required: true
      description: The ID of the token, the part of it between ellaims_ and the next underscore.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MCPTTID:
      name: mcptt_id
      in: path
      required: true
      schema:
        type: string
        examples: ["sip:alice@mcptt.example.com"]
    MCPTTGroupID:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        examples: ["sip:fire@mcptt.example.com"]

  schemas:
    LoginParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InitializeParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"

    LoginResponse:
      type: object
      required: [message, token]
      properties:
        message:
          type: string
        token:
          type: string
          description: The access token, valid for 15 minutes.

    RefreshResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Password:
      type: string
      description: 8 to 72 bytes.
      minLength: 8
      maxLength: 72

    RoleID:
      type: integer
      enum: [1, 2, 3]
      description: >-
        1 Admin: everything. 2 Read Only: reads the settings and the state of the IMS. 3 Network Manager: also changes
        the settings and re-authenticates registrations, but does not manage users.

    User:
      type: object
      required: [email, role_id]
      properties:
        email:
          type: string
          format: email
        role_id:
          $ref: "#/components/schemas/RoleID"

    ListUsersResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateUserParams:
      type: object
      required: [email, password, role_id]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"
        role_id:
          $ref: "#/components/schemas/RoleID"

    UpdateUserParams:
      type: object
      required: [role_id]
      additionalProperties: false
      properties:
        role_id:
          $ref: "#/components/schemas/RoleID"

    UpdatePasswordParams:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          $ref: "#/components/schemas/Password"

    UpdateMyPasswordParams:
      type: object
      required: [current_password, password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        password:
          $ref: "#/components/schemas/Password"

    APIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a token that does not expire.
        last_used_at:
          type: string
          format: date-time
          description: Absent for a token never used. Updated at most once a minute.

    ListAPITokensResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateAPITokenParams:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        expires_at:
          type: string
          format: date-time
          description: When the token expires. Without it, the token does not expire.

    CreateAPITokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token, ellaims_ followed by its ID, an underscore and its secret.

    E164:
      type: string
      pattern: '^\+[1-9][0-9]{0,14}$'
      examples: ["+15551230001"]
    Operator:
      type: object
      additionalProperties: false
      required: [mcc, mnc, numbering]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
        numbering:
          $ref: "#/components/schemas/Numbering"

    Numbering:
      type: object
      additionalProperties: false
      required: [country_code, national_prefix, international_prefix]
      description: Conversion of dial strings to E.164 numbers.
      properties:
        country_code:
          type: string
          pattern: "^[1-9][0-9]{0,2}$"
        national_prefix:
          type: string
          pattern: "^[0-9]{0,4}$"
        international_prefix:
          type: string
          pattern: "^[0-9]{0,4}$"

    OperatorResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Operator"

    DiameterIdentity:
      type: object
      required: [host, realm]
      properties:
        host:
          type: string
          examples: [ims.ims.mnc001.mcc001.3gppnetwork.org]
        realm:
          type: string
          examples: [ims.mnc001.mcc001.3gppnetwork.org]

    DiameterPeerParams:
      type: object
      required: [address, applications]
      properties:
        host:
          type: string
          description: >-
            The DiameterIdentity of the peer, which must then match the Origin-Host of its capabilities exchange.
            Absent or empty takes the Origin-Host the peer gives.
        address:
          type: string
          description: An IPv4 or IPv6 address.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 3868
        transport:
          type: string
          enum: [tcp, sctp]
          default: tcp
        applications:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            cx for an HSS or an SLF, and sh and s6c for its IP-SM-GW functions; rx for a PCRF or a DRA; sgd for an
            SMSC, and for an MME or SMSF that the IP-SM-GW delivers short messages to.
          items:
            type: string
            enum: [cx, rx, sh, s6c, sgd]
        priority:
          type: integer
          minimum: 0
          maximum: 65535
          default: 10
          description: >-
            Requests try the peers serving their application by priority, lowest first, and share them between
            peers of the same priority. HSSs of the same priority must share their state, as the nodes of a
            replicated HSS do.
        service_centres:
          type: array
          uniqueItems: true
          description: >-
            The service centre addresses of an SMSC, which needs sgd in applications: the IP-SM-GW sends a short
            message from a phone to an SMSC of the service centre address the phone gives, by priority, at its host,
            which is then required.
          items:
            type: string
            pattern: "^[0-9]{1,15}$"
            examples: ["15550000000"]

    DiameterPeer:
      allOf:
        - $ref: "#/components/schemas/DiameterPeerParams"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
              description: A UUIDv7.
            status:
              $ref: "#/components/schemas/DiameterPeerStatus"

    DiameterPeerStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [down, connecting, open, suspect, reopen, closing]
        since:
          type: string
          format: date-time
        remote_address:
          type: string
        host:
          type: string
          description: The Origin-Host the peer gave in its last capabilities exchange, else the configured host.
        realm:
          type: string
          description: The realm the peer gave in its last capabilities exchange.
        error:
          type: string
          description: Why the last connection to the peer failed.

    DiameterPeerResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DiameterPeer"

    DiameterRouteParams:
      type: object
      properties:
        realm:
          type: string
          description: >-
            The realm of the HSS for cx, sh and s6c, of the PCRF for rx. Absent or empty is the realm of cx for sh
            and s6c, and the home domain otherwise.
          examples: [epc.mnc001.mcc001.3gppnetwork.org]

    DiameterRoute:
      allOf:
        - $ref: "#/components/schemas/DiameterRouteParams"
        - type: object
          required: [application, realm, destination_realm, peers]
          properties:
            application:
              type: string
              enum: [cx, rx, sh, s6c]
            destination_realm:
              type: string
              description: The Destination-Realm of the requests, the default of realm if it is empty.
            peers:
              type: array
              description: The peers serving the application, in the order requests try them.
              items:
                type: object
                required: [id, host, priority, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  host:
                    type: string
                  priority:
                    type: integer
                  status:
                    $ref: "#/components/schemas/DiameterPeerStatus"

    DiameterRouteResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DiameterRoute"

    Policy:
      type: object
      required: [interface]
      properties:
        interface:
          type: string
          enum: [none, rx, n5]
        n5:
          type: object
          additionalProperties: false
          description: For the n5 interface only.
          required: [pcf_uri]
          properties:
            pcf_uri:
              type: string
              description: The API root of the PCF, http[s]://host[:port][/prefix].

    PolicyResult:
      type: object
      properties:
        result:
          allOf:
            - $ref: "#/components/schemas/Policy"
            - type: object
              required: [status]
              properties:
                status:
                  type: object
                  required: [interface]
                  description: Policy function running.
                  properties:
                    interface:
                      type: string
                      enum: [none, rx, n5]
                    endpoint:
                      type: string
                    notify:
                      type: string
                    last:
                      type: object
                      description: The outcome of the last request to the PCF.
                      properties:
                        at:
                          type: string
                          format: date-time
                        reachable:
                          type: boolean
                        result:
                          type: string

    SIPStatus:
      type: object
      required: [home_domain, aliases, listeners]
      properties:
        home_domain:
          type: string
        aliases:
          type: array
          items:
            type: string
        listeners:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              address:
                type: string
              transports:
                type: array
                items:
                  type: string

    Registration:
      type: object
      required: [impi, implicit_registration_sets]
      properties:
        impi:
          type: string
          description: Private user identity.
          examples: [001010000000001@ims.mnc001.mcc001.3gppnetwork.org]
        implicit_registration_sets:
          type: array
          description: >-
            The registered implicit registration sets of the private identity. A set registers and deregisters as one
            (TS 23.228 §5.2.1a.0).
          items:
            $ref: "#/components/schemas/ImplicitRegistrationSet"

    ImplicitRegistrationSet:
      type: object
      required: [identities, contacts]
      properties:
        hss:
          type: object
          description: >-
            The HSS the S-CSCF sends the set's Cx requests to (TS 29.229 §5.5): the Origin-Host and Origin-Realm of its
            last answer. Absent while unknown.
          required: [host, realm]
          properties:
            host:
              type: string
              examples: [mmec01.mmegi0001.mme.epc.mnc001.mcc001.3gppnetwork.org]
            realm:
              type: string
              examples: [epc.mnc001.mcc001.3gppnetwork.org]
        identities:
          type: array
          description: The public user identities of the set.
          items:
            type: object
            required: [uri, barred, registered_with]
            properties:
              uri:
                type: string
                examples: [tel:+15551230001]
              display_name:
                type: string
              barred:
                type: boolean
              registered_with:
                type: array
                description: >-
                  The other private identities a request to this public identity reaches (TS 24.229 §5.4.3.3 step 8).
                items:
                  type: string
        contacts:
          type: array
          description: >-
            The unexpired contacts bound to the set. A contact bound to several sets is listed in each, with that
            binding's times.
          items:
            type: object
            required: [contact, q, media, registered_at, expires_at, protected, signalling_path]
            properties:
              contact:
                type: string
              instance:
                type: string
                description: Instance ID, an IMEI URN when available (TS 23.003 §13.8).
                examples: [urn:gsma:imei:35000000-000001-0]
              reg_id:
                type: integer
                description: The reg-id of the flow, when the contact is one of the device's flows (RFC 5626).
              q:
                type: number
                description: The q-value of the contact (RFC 3841 §7.2.3).
              media:
                type: array
                description: The media the device registered for.
                items:
                  type: string
                  enum: [audio, video]
              registered_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
              address:
                type: string
                description: Address and port of the device, as seen by the P-CSCF.
              transport:
                type: string
                enum: [udp, tcp]
              protected:
                type: boolean
                description: Whether IPsec protects the signalling of the device.
              signalling_path:
                type: string
                enum: [unmonitored, monitored, lost]
                description: State of the IMS signalling path of the device.

    CallOutcome:
      type: string
      enum: [answered, cancelled, busy, rejected, no_answer, unavailable, failed]
      description: |
        answered: 2xx. cancelled: 487 to a caller CANCEL. busy: 486, 600. rejected: 603. no_answer: 408 after a 180.
        unavailable: 480. failed: any other final status.

    CallRecord:
      type: object
      required: [id, icid, session_id, calling_party, requested_party, requested_at, alerted, media, in_progress,
        incomplete]
      properties:
        id:
          type: integer
        icid:
          type: string
          description: icid-value of the P-Charging-Vector (TS 32.298 §5.1.3.1.19).
        session_id:
          type: string
          description: Call-ID of the INVITE (§5.1.3.1.59).
        calling_party:
          type: array
          items:
            type: string
          description: P-Asserted-Identity values (§5.1.3.1.24).
        caller_impi:
          type: string
          description: Private user identity of the caller (§5.1.3.1.36).
        requested_party:
          type: string
          description: Request-URI from the caller (§5.1.3.1.43).
        called_party:
          type: string
          description: Request-URI after normalisation by the S-CSCF (§5.1.3.1.9).
        callee_impi:
          type: string
          description: Private user identity of the answering registration (§5.1.3.1.36).
        requested_at:
          type: string
          format: date-time
          description: Reception time of the INVITE (§5.1.3.1.58).
        delivery_start_at:
          type: string
          format: date-time
          description: Time of the final response to the caller (§5.1.3.1.55).
        delivery_end_at:
          type: string
          format: date-time
          description: End time of an answered call (§5.1.3.1.54).
        sip_status:
          type: integer
          description: Final status of the INVITE sent to the caller (§5.1.3.1.57).
        outcome:
          $ref: "#/components/schemas/CallOutcome"
        ended_by:
          type: string
          enum: [caller, callee, network]
        alerted:
          type: boolean
          description: A 180 reached the caller.
        media:
          type: array
          items:
            type: string
          description: Media types of the accepted m-lines.
        in_progress:
          type: boolean
          description: The call has not ended.
        incomplete:
          type: boolean
          description: Closed without the end of the call.
        duration_ms:
          type: integer
          description: Duration of an answered call that ended, in milliseconds.

    CallRecordRetention:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650

    CallRecordRetentionResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CallRecordRetention"

    IPSMGWParams:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: string
          pattern: "^[0-9]{0,15}$"
          description: >-
            The E.164 number of the IP-SM-GW, digits only, which it registers at the HSS for the users able to
            receive short messages over IP. Empty registers none.
          examples: ["15550000100"]

    IPSMGW:
      allOf:
        - $ref: "#/components/schemas/IPSMGWParams"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              description: The SIP URI of the IP-SM-GW, which the iFCs of the HSS name it by.
              examples: ["sip:ipsmgw.ims.mnc001.mcc001.3gppnetwork.org"]

    IPSMGWResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/IPSMGW"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MCPTTServiceConfiguration:
      type: object
      description: >-
        The service configuration of the organisation (TS 24.484 §8.4) that an operator sets. The server fixes the
        rest: the floor control timers and counters to the defaults of TS 24.380 Table 11.1.3-1 and Table 11.2.3-1, T7
        (Floor Idle) to 2 s, 4 priority levels.
      required: [domain]
      properties:
        domain:
          type: string
          description: >-
            The domain of the organisation, of its MCPTT IDs and group IDs, and the IOI of its charging. The IMS home
            domain until set; setting the home domain makes it follow the home domain again.
          examples: [mcptt.example.com]
        transmit_time_limit_ms:
          type: integer
          minimum: 1
          description: How long a participant may talk at a time, T2 (TS 24.380 Table 11.1.3-1); 30 s if absent.
    MCPTTServiceConfigurationResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/MCPTTServiceConfiguration"

    MCPTTUserInput:
      type: object
      description: >-
        An MCPTT user (TS 24.484 §8.3) as an operator sets it. The server fixes the rest of its profile: no limit of
        affiliations (N2) nor of simultaneous calls (N6).
      required: [impus]
      properties:
        mcptt_id:
          type: string
          examples: ["sip:alice@mcptt.example.com"]
        alias:
          type: string
          maxLength: 64
          description: The user's alias (TS 24.484 §8.3.2.7), its name for people; none if empty or absent.
          examples: [Alice]
        impus:
          type: array
          items:
            type: string
          examples: [["sip:alice@ims.example.com"]]
        implicit_affiliations:
          type: array
          items:
            type: string
          examples: [["sip:fire@mcptt.example.com"]]
    MCPTTUserCreate:
      allOf:
        - $ref: "#/components/schemas/MCPTTUserInput"
        - required: [mcptt_id]
    MCPTTUser:
      allOf:
        - $ref: "#/components/schemas/MCPTTUserInput"
        - required: [mcptt_id, alias, impus, implicit_affiliations]
    MCPTTUserResult:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/MCPTTUser"

    MCPTTMemberInput:
      type: object
      description: >-
        A member of the group (TS 24.481 §7.2.2). The server fixes the rest of the entry: the lowest priority, neither
        required nor required to be affiliated.
      properties:
        mcptt_id:
          type: string
        recvonly:
          type: boolean
          description: The member may listen but not talk.
        implicit_affiliation:
          type: boolean
          description: >-
            Whether the group is one of the user's implicit affiliations (its implicit_affiliations), which the user's
            profile has, not the member. Absent from a request, it is as it was; a member removed loses it. A change
            applies to the user's registered clients at once: set, they are affiliated to the group; cleared, the
            affiliations the server made from it are removed, those the clients made themselves stay.

    MCPTTMember:
      allOf:
        - $ref: "#/components/schemas/MCPTTMemberInput"
        - required: [mcptt_id, recvonly, implicit_affiliation]

    MCPTTGroupInput:
      type: object
      description: >-
        A prearranged group (TS 24.481 §7.2) as an operator sets it, its calls of AMR-WB. The server fixes the rest of
        its document: no limit of participants, no minimum to start nor of affiliated members.
      required: [maximum_duration_ms]
      properties:
        group_id:
          type: string
          examples: ["sip:fire@mcptt.example.com"]
        display_name:
          type: string
          maxLength: 64
          description: The group name (TS 24.481 §7.2.2); none if empty or absent.
          examples: [Fire]
        hang_timer_ms:
          type: integer
          description: How long a call lasts without anyone talking, T4 (TS 24.380 Table 11.1.3-1); 30 s if absent.
        maximum_duration_ms:
          type: integer
          minimum: 1
          description: How long a call lasts at most, TNG3 (TS 24.379 §6.3.3.5).
        release_on_initiator_leave:
          type: boolean
          description: A call ends when the member that started it leaves (TS 24.379 §6.3.8.1 3).
        members:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MCPTTMemberInput"
              - required: [mcptt_id]
    MCPTTGroupCreate:
      allOf:
        - $ref: "#/components/schemas/MCPTTGroupInput"
        - required: [group_id]
    MCPTTGroup:
      allOf:
        - $ref: "#/components/schemas/MCPTTGroupInput"
        - required: [group_id, display_name, maximum_duration_ms, release_on_initiator_leave, members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/MCPTTMember"
    MCPTTGroupResult:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/MCPTTGroup"

    MCPTTRegistration:
      type: object
      required: [mcptt_id, client_id, impu, impus, since, expires_at, contacts]
      properties:
        mcptt_id:
          type: string
        client_id:
          type: string
          description: The MCPTT client ID (TS 24.379 §4.10).
        impu:
          type: string
          description: The IMS public user identity the client registered at.
        impus:
          type: array
          description: The public user identities it is served at, impu first.
          items:
            type: string
        since:
          type: string
          format: date-time
          description: When the client was authorised for the user, kept by the refreshes.
        expires_at:
          type: string
          format: date-time
        contacts:
          type: array
          description: The contacts the client registered, in direct mode; none through the IMS.
          items:
            type: string

    MCPTTAffiliation:
      type: object
      required: [mcptt_id, client_id, group_id, status, implicit]
      properties:
        mcptt_id:
          type: string
        client_id:
          type: string
        group_id:
          type: string
        status:
          type: string
          enum: [affiliating, affiliated, deaffiliating]
          description: >-
            The affiliation status at the participating function (TS 24.379 §9.2.2.2.2). Affiliating and affiliated
            count as affiliated, deaffiliating does not (§9.2.2.2.11 3a). Group calls invite the members the
            controlling function holds affiliated (§9.2.2.3.2), which can trail or lead this status around a PUBLISH.
        implicit:
          type: boolean
          description: >-
            How the client was affiliated: true if the server affiliated it from the user's implicit affiliations (TS
            24.379 §9.2.2.2.15), at its registration or once the setting changed; false if the client affiliated
            itself (§9.2.2.2.3), which an implicit affiliation becomes once the client's PUBLISH lists the group. A
            change of the implicit affiliations applies to the registered clients at once: a group added affiliates
            them, a group removed de-affiliates the implicit affiliations only.

    MCPTTCall:
      type: object
      required: [id, session_id, group_id, originator, created_at, started_at, ends_at, talker, participants]
      properties:
        id:
          type: string
          description: The "gr" of the MCPTT session identity, which names the call.
        session_id:
          type: string
          description: The MCPTT session identity (TS 24.379 §4.5).
        group_id:
          type: string
        originator:
          type: string
          description: The MCPTT ID of the member that started the call.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the originator was answered; null while the call is set up.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: When the call's maximum duration (TNG3) releases it.
        talker:
          oneOf:
            - type: "null"
            - type: object
              required: [mcptt_id, since]
              properties:
                mcptt_id:
                  type: string
                since:
                  type: string
                  format: date-time
          description: The participant with the floor, null if the floor is idle.
        participants:
          type: array
          description: The members invited and joined, the originator first.
          items:
            type: object
            required: [mcptt_id, state, required, recvonly]
            properties:
              mcptt_id:
                type: string
              state:
                type: string
                enum: [invited, joined]
              required:
                type: boolean
              recvonly:
                type: boolean

    MCPTTStatus:
      type: object
      required: [mode, name, participating_psi, controlling_psi, sip, media_control]
      properties:
        mode:
          type: string
          enum: [ims, direct]
        name:
          type: string
          description: The server name of the AS in the iFCs of the HSS, of the home domain.
          examples: ["sip:mcptt.ims.mnc001.mcc001.3gppnetwork.org"]
        participating_psi:
          type: string
          examples: ["sip:mcptt-participating@mcptt.ims.mnc001.mcc001.3gppnetwork.org"]
        controlling_psi:
          type: string
          examples: ["sip:mcptt-controlling@mcptt.ims.mnc001.mcc001.3gppnetwork.org"]
        sip:
          type: array
          items:
            type: string
        media_control:
          type: string

  responses:
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too Many Requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Login:
      description: Logged in. The response sets the ims_session cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/LoginResponse"
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
