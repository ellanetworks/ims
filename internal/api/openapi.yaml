openapi: "3.1.0"
info:
  title: Ella IMS API
  version: "1.0.0"
  description: |
    Success: `{"result": <payload>}`. Error: `{"error": "message"}`.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5020

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Operator
  - name: Diameter
  - name: Policy
  - name: SIP
  - name: Registrations
  - name: Call records
  - name: IP-SM-GW
  - name: MCPTT service configuration
  - name: MCPTT users
  - name: MCPTT groups
  - name: MCPTT live state
  - name: Status
  - name: Metrics
  - name: Specification

paths:
  /api/v1/operator:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Get the operator
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResult"
    put:
      tags: [Operator]
      operationId: updateOperator
      summary: Update the operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Operator"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The operator as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter:
    get:
      tags: [Diameter]
      operationId: getDiameter
      summary: Get the Diameter identity of the IMS
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The Diameter identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/DiameterIdentity"

  /api/v1/diameter/peers:
    get:
      tags: [Diameter]
      operationId: listDiameterPeers
      summary: List the Diameter peers
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The peers, in the order they were created in
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiameterPeer"
    post:
      tags: [Diameter]
      operationId: createDiameterPeer
      summary: Create a Diameter peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterPeerParams"
              unevaluatedProperties: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The peer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Diameter]
      operationId: getDiameterPeer
      summary: Get a Diameter peer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The peer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterPeer
      summary: Update a Diameter peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterPeerParams"
              unevaluatedProperties: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The peer as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Diameter]
      operationId: deleteDiameterPeer
      summary: Delete a Diameter peer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/routes:
    get:
      tags: [Diameter]
      operationId: listDiameterRoutes
      summary: List where Cx and Rx requests go
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The routes, cx then rx
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiameterRoute"

  /api/v1/diameter/routes/{application}:
    parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          enum: [cx, rx, sh, s6c]
    get:
      tags: [Diameter]
      operationId: getDiameterRoute
      summary: Get where an application's requests go
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterRouteResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterRoute
      summary: Set the realm of an application's requests
      description: The next request goes to the new realm, through the peers serving the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterRouteParams"
              unevaluatedProperties: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The route as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterRouteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policy:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: Get the policy function of the P-CSCF
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The policy function, and the one running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResult"
    put:
      tags: [Policy]
      operationId: updatePolicy
      summary: Update the policy function of the P-CSCF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
              unevaluatedProperties: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The policy function as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sip:
    get:
      tags: [SIP]
      operationId: getSIP
      summary: Get the SIP names and listeners of the IMS
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The home domain, the aliases derived from it, and the listeners
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/SIPStatus"

  /api/v1/registrations:
    get:
      tags: [Registrations]
      operationId: listRegistrations
      summary: List the registrations
      parameters:
        - name: search
          in: query
          description: Substring of a private or public identity.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of registrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Registration"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/registrations/{impi}/reauthenticate:
    post:
      tags: [Registrations]
      operationId: reauthenticate
      summary: Re-authenticate a registered UE
      parameters:
        - name: impi
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          description: Re-authentication started
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      impi:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The IMS is restarting to apply its settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/call-records:
    get:
      tags: [Call records]
      operationId: listCallRecords
      summary: List the call records
      description: Most recently requested first.
      parameters:
        - name: search
          in: query
          description: Substring of the ICID or of an identity of the caller or the callee.
          schema:
            type: string
        - name: start
          in: query
          description: Earliest request time, inclusive.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Latest request time, exclusive.
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          description: Outcomes to include.
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CallOutcome"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of call records
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CallRecord"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/call-records/{id}:
    get:
      tags: [Call records]
      operationId: getCallRecord
      summary: Get a call record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The call record
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/CallRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/call-records/retention:
    get:
      tags: [Call records]
      operationId: getCallRecordRetention
      summary: Get how long call records are kept
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The retention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecordRetentionResult"
    put:
      tags: [Call records]
      operationId: updateCallRecordRetention
      summary: Change how long call records are kept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRecordRetention"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The retention, as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecordRetentionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ip-sm-gw:
    get:
      tags: [IP-SM-GW]
      operationId: getIPSMGW
      summary: Get the built-in IP-SM-GW
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The IP-SM-GW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPSMGWResult"
    put:
      tags: [IP-SM-GW]
      operationId: updateIPSMGW
      summary: Set the IP-SM-GW number
      description: >-
        The IP-SM-GW registers the new number at the HSS at once for the users it serves; an empty number
        deregisters it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IPSMGWParams"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The IP-SM-GW, as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPSMGWResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt:
    get:
      tags: [MCPTT service configuration]
      operationId: getMCPTTStatus
      summary: Get what the MCPTT AS runs
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The MCPTT AS's mode, name, PSIs and addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/MCPTTStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/mcptt/service-configuration:
    get:
      tags: [MCPTT service configuration]
      operationId: getMCPTTServiceConfiguration
      summary: Get the service configuration
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The service configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTServiceConfigurationResult"
    put:
      tags: [MCPTT service configuration]
      operationId: updateMCPTTServiceConfiguration
      summary: Replace the service configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTServiceConfiguration"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The service configuration as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTServiceConfigurationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/users:
    get:
      tags: [MCPTT users]
      operationId: listMCPTTUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of the users
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTUser"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [MCPTT users]
      operationId: createMCPTTUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTUserCreate"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The user as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTUserResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/users/{mcptt_id}:
    parameters:
      - $ref: "#/components/parameters/MCPTTID"
    get:
      tags: [MCPTT users]
      operationId: getMCPTTUser
      summary: Get a user
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTUserResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [MCPTT users]
      operationId: updateMCPTTUser
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTUserInput"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The user as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTUserResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [MCPTT users]
      operationId: deleteMCPTTUser
      summary: Delete a user
      description: >-
        The user leaves its groups; a group it leaves that would be invalid without it is a conflict. Its clients are
        logged off, and leave the group calls they are in at once.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/groups:
    get:
      tags: [MCPTT groups]
      operationId: listMCPTTGroups
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of the groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTGroup"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [MCPTT groups]
      operationId: createMCPTTGroup
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTGroupCreate"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/MCPTTGroupID"
    get:
      tags: [MCPTT groups]
      operationId: getMCPTTGroup
      summary: Get a group
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [MCPTT groups]
      operationId: updateMCPTTGroup
      summary: Replace a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTGroupInput"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [MCPTT groups]
      operationId: deleteMCPTTGroup
      summary: Delete a group
      description: >-
        The group goes from the implicit affiliations of its users, its affiliations are removed, and its call, if any,
        is released at once.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/groups/{group_id}/members/{mcptt_id}:
    parameters:
      - $ref: "#/components/parameters/MCPTTGroupID"
      - $ref: "#/components/parameters/MCPTTID"
    put:
      tags: [MCPTT groups]
      operationId: putMCPTTMember
      summary: Add or replace a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTTMemberInput"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "201":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [MCPTT groups]
      operationId: deleteMCPTTMember
      summary: Remove a member
      description: >-
        The group goes from the user's implicit affiliations, the user's clients are de-affiliated from it, and leave
        its call, if any, at once.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The group as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTTGroupResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcptt/registrations:
    get:
      tags: [MCPTT live state]
      operationId: listMCPTTRegistrations
      summary: List the registered clients
      description: The MCPTT clients bound to their users by service authorisation, by MCPTT ID and client ID; of the user of mcptt_id if given.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: mcptt_id
          in: query
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of them
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTRegistration"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mcptt/affiliations:
    get:
      tags: [MCPTT live state]
      operationId: listMCPTTAffiliations
      summary: List the affiliations
      description: The affiliations of the clients to groups, by group, MCPTT ID and client ID; of the user of mcptt_id and the group of group_id if given.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: mcptt_id
          in: query
          schema:
            type: string
        - name: group_id
          in: query
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of them
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTAffiliation"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mcptt/calls:
    get:
      tags: [MCPTT live state]
      operationId: listMCPTTCalls
      summary: List the group calls
      description: The group calls, oldest first; of the group of group_id, with the participant of mcptt_id, if given.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: mcptt_id
          in: query
          schema:
            type: string
        - name: group_id
          in: query
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of them
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MCPTTCall"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mcptt/calls/{call_id}:
    parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [MCPTT live state]
      operationId: getMCPTTCall
      summary: Get a group call
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The call
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/MCPTTCall"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      security: []
      summary: Get the status of the IMS
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [version, revision, initialized]
                    properties:
                      version:
                        type: string
                        examples: [v0.0.1]
                      revision:
                        type: string
                        description: Git commit of the build, empty in development builds.
                      initialized:
                        type: boolean
                        description: Whether the first user exists. Until then, POST /api/v1/init creates it.

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      security: []
      summary: Get the metrics of the IMS in the Prometheus formats
      responses:
        "200":
          description: The metrics, in the format the request's Accept header negotiates
          content:
            text/plain:
              schema:
                type: string

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      security: []
      summary: Get this specification
      responses:
        "200":
          description: The specification
          content:
            application/openapi+yaml: {}

  /api/v1/init:
    post:
      tags: [Auth]
      operationId: initialize
      security: []
      summary: Create the first user
      description: >-
        Creates the first user, an admin, and logs it in. Until it is called, anyone who can reach the API can call it.
        It fails once a user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeParams"
      responses:
        "201":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in
      description: >-
        Returns an access token, valid for 15 minutes, and sets the session cookie with which
        POST /api/v1/auth/refresh issues new ones. At most 20 attempts per minute per client address (IPv6 /64), and
        100 wrong passwords per hour per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security:
        - SessionCookie: []
      summary: Refresh the access token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Log out
      description: Ends the session of the cookie, if any, and clears the cookie.
      responses:
        "204":
          description: Logged out

