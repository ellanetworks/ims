openapi: "3.1.0"
info:
  title: Ella IMS API
  version: "1.0.0"
  description: |
    Success: `{"result": <payload>}`. Error: `{"error": "message"}`.

    Settings are replaced in full by `PUT`, which answers with the resource as stored. Unknown fields are
    rejected. A change applies without a restart of the process: a change of MCC or MNC, of the Diameter peers or
    of the policy function restarts Diameter and SIP, which peers and UEs reconnect to.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5020

security: []

tags:
  - name: Operator
  - name: Diameter
  - name: Policy
  - name: SIP
  - name: Registrations
  - name: Call records
  - name: Status
  - name: Specification

paths:
  /api/v1/operator:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Get the operator
      responses:
        "200":
          description: The operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResult"
    put:
      tags: [Operator]
      operationId: updateOperator
      summary: Update the operator
      description: |
        The names of the IMS (home domain, Diameter identity, S-CSCF name, SIP aliases) are derived from MCC and
        MNC, so changing them renames the IMS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Operator"
      responses:
        "200":
          description: The operator as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter:
    get:
      tags: [Diameter]
      operationId: getDiameter
      summary: Get the Diameter identity of the IMS
      description: Derived from the operator. Peers must know the IMS by this host and realm.
      responses:
        "200":
          description: The Diameter identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/DiameterIdentity"

  /api/v1/diameter/peers:
    get:
      tags: [Diameter]
      operationId: listDiameterPeers
      summary: List the Diameter peers
      responses:
        "200":
          description: The peers, in the order they were created in
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiameterPeer"
    post:
      tags: [Diameter]
      operationId: createDiameterPeer
      summary: Create a Diameter peer
      description: At most one peer serves each application. The IMS then connects to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterPeerParams"
      responses:
        "201":
          description: The peer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Diameter]
      operationId: getDiameterPeer
      summary: Get a Diameter peer
      responses:
        "200":
          description: The peer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterPeer
      summary: Update a Diameter peer
      description: |
        The IMS then reconnects to it. A peer moved to another address or port reconnects with no other effect;
        any other change restarts Diameter and SIP, which ends the QoS of calls in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiameterPeerParams"
      responses:
        "200":
          description: The peer as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiameterPeerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Diameter]
      operationId: deleteDiameterPeer
      summary: Delete a Diameter peer
      description: The peer serving rx cannot be deleted while the policy interface is rx.
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policy:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: Get the policy function of the P-CSCF
      responses:
        "200":
          description: The policy function, and the one running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResult"
    put:
      tags: [Policy]
      operationId: updatePolicy
      summary: Update the policy function of the P-CSCF
      description: |
        rx uses the Diameter peer serving rx. n5 requires the n5 section of the configuration file, with n5.tls for
        an https PCF URI. Calls and registrations after the change use the new policy function.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          description: The policy function as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sip:
    get:
      tags: [SIP]
      operationId: getSIP
      summary: Get the SIP names and listeners of the IMS
      responses:
        "200":
          description: The home domain, the aliases derived from it, and the listeners
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/SIPStatus"

  /api/v1/registrations:
    get:
      tags: [Registrations]
      operationId: listRegistrations
      summary: List the registrations
      description: |
        The private identities registered with the IMS, in order, each with its public identities and the devices
        registered with it. A private identity registered with several registration sets is listed once.
      parameters:
        - name: search
          in: query
          description: Part of a private or public identity, such as an IMSI or a phone number.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A page of registrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Registration"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/registrations/{impi}/reauthenticate:
    post:
      tags: [Registrations]
      operationId: reauthenticate
      summary: Re-authenticate a registered UE
      parameters:
        - name: impi
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Re-authentication started
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      impi:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The IMS is restarting to apply its settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/call-records:
    get:
      tags: [Call records]
      operationId: listCallRecords
      summary: List the call records
      description: |
        A record of each call a registered UE made, the most recently requested first. Its fields follow the IMS
        CDR parameters of TS 32.298 §5.1.3.1. Records are kept for the retention, and at most 1,000,000.
      parameters:
        - name: search
          in: query
          description: Part of the ICID, or of an identity of the caller or the callee, such as an IMSI or a phone number.
          schema:
            type: string
        - name: from
          in: query
          description: The earliest time a call was requested, included.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: The latest time a call was requested, excluded.
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          description: The outcomes to list. A call in progress has none until its final response.
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CallOutcome"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A page of call records
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CallRecord"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/call-records/{id}:
    get:
      tags: [Call records]
      operationId: getCallRecord
      summary: Get a call record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The call record
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/CallRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/call-records/retention:
    get:
      tags: [Call records]
      operationId: getCallRecordRetention
      summary: Get how long call records are kept
      responses:
        "200":
          description: The retention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecordRetentionResult"
    put:
      tags: [Call records]
      operationId: updateCallRecordRetention
      summary: Change how long call records are kept
      description: The records older than the new retention are deleted at the next pruning, within an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRecordRetention"
      responses:
        "200":
          description: The retention, as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecordRetentionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Get the status of the IMS
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required: [version, revision]
                    properties:
                      version:
                        type: string
                        examples: [v0.0.1]
                      revision:
                        type: string
                        description: The git commit the IMS was built from, empty in development builds.

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      summary: Get this specification
      responses:
        "200":
          description: The specification
          content:
            application/openapi+yaml: {}

components:
  schemas:
    Operator:
      type: object
      additionalProperties: false
      required: [mcc, mnc, numbering]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
        numbering:
          $ref: "#/components/schemas/Numbering"

    Numbering:
      type: object
      additionalProperties: false
      required: [country_code, national_prefix, international_prefix]
      description: How dial strings become E.164 numbers. The prefixes may be empty, and must differ.
      properties:
        country_code:
          type: string
          pattern: "^[1-9][0-9]{0,2}$"
        national_prefix:
          type: string
          pattern: "^[0-9]{0,4}$"
        international_prefix:
          type: string
          pattern: "^[0-9]{0,4}$"

    OperatorResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Operator"

    DiameterIdentity:
      type: object
      required: [host, realm]
      properties:
        host:
          type: string
          examples: [ims.ims.mnc001.mcc001.3gppnetwork.org]
        realm:
          type: string
          examples: [ims.mnc001.mcc001.3gppnetwork.org]

    DiameterPeerParams:
      type: object
      additionalProperties: false
      required: [host, realm, address, applications]
      properties:
        host:
          type: string
        realm:
          type: string
        address:
          type: string
          description: An IPv4 or IPv6 address.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 3868
        transport:
          type: string
          enum: [tcp, sctp]
          default: tcp
        applications:
          type: array
          minItems: 1
          uniqueItems: true
          description: cx for the HSS, rx for the PCRF.
          items:
            type: string
            enum: [cx, rx]

    DiameterPeer:
      allOf:
        - $ref: "#/components/schemas/DiameterPeerParams"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
              description: A UUIDv7.
            status:
              $ref: "#/components/schemas/DiameterPeerStatus"

    DiameterPeerStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [down, connecting, open, suspect, reopen, closing]
        since:
          type: string
          format: date-time
        remote_address:
          type: string

    DiameterPeerResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DiameterPeer"

    Policy:
      type: object
      additionalProperties: false
      required: [interface]
      properties:
        interface:
          type: string
          enum: [none, rx, n5]
        n5:
          type: object
          additionalProperties: false
          description: For the n5 interface only.
          required: [pcf_uri]
          properties:
            pcf_uri:
              type: string
              description: The API root of the PCF, http[s]://host[:port][/prefix].

    PolicyResult:
      type: object
      properties:
        result:
          allOf:
            - $ref: "#/components/schemas/Policy"
            - type: object
              required: [status]
              properties:
                status:
                  type: object
                  required: [interface]
                  description: The policy function running, which differs from the settings while they are applied.
                  properties:
                    interface:
                      type: string
                      enum: [none, rx, n5]
                    endpoint:
                      type: string
                    notify:
                      type: string
                    last:
                      type: object
                      description: The outcome of the last request to the PCF.
                      properties:
                        at:
                          type: string
                          format: date-time
                        reachable:
                          type: boolean
                        result:
                          type: string

    SIPStatus:
      type: object
      required: [home_domain, aliases, listeners]
      properties:
        home_domain:
          type: string
        aliases:
          type: array
          items:
            type: string
        listeners:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              address:
                type: string
              transports:
                type: array
                items:
                  type: string

    Registration:
      type: object
      required: [impi, identities, devices]
      properties:
        impi:
          type: string
          description: The private user identity, which identifies the subscription.
          examples: [001010000000001@ims.mnc001.mcc001.3gppnetwork.org]
        identities:
          type: array
          description: The public user identities, from the HSS.
          items:
            type: object
            required: [uri, barred]
            properties:
              uri:
                type: string
                examples: [tel:+15551230001]
              display_name:
                type: string
              barred:
                type: boolean
        devices:
          type: array
          description: The contacts registered, one per device.
          items:
            type: object
            required: [contact, media, registered_at, expires_at, protected, signalling_path]
            properties:
              contact:
                type: string
              instance:
                type: string
                description: The instance ID of the device, its IMEI URN when it has one (TS 23.003 §13.8).
                examples: [urn:gsma:imei:35000000-000001-0]
              media:
                type: array
                description: The media the device registered for.
                items:
                  type: string
                  enum: [audio, video]
              registered_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
              address:
                type: string
                description: The address and port of the device, as the P-CSCF sees it.
              transport:
                type: string
                enum: [udp, tcp]
              protected:
                type: boolean
                description: Whether IPsec protects the signalling of the device.
              signalling_path:
                type: string
                enum: [unmonitored, monitored, lost]
                description: |
                  The IMS signalling path of the device, which the P-CSCF monitors through the policy function.

    CallOutcome:
      type: string
      enum: [answered, cancelled, busy, rejected, no_answer, failed]
      description: |
        How a call ended: answered with a 2xx; cancelled by the caller (487); busy (486, 600); rejected by the callee
        (603); no_answer, a 408 or 480 after a device rang; failed, any other final response, including those of the
        IMS itself.

    CallRecord:
      type: object
      required: [id, icid, session_id, calling_party, requested_party, requested_at, alerted, media, in_progress,
        incomplete]
      properties:
        id:
          type: integer
        icid:
          type: string
          description: The IMS charging identifier, the icid-value of the P-Charging-Vector (TS 32.298 §5.1.3.1.19).
        session_id:
          type: string
          description: The Call-ID of the caller's INVITE (§5.1.3.1.59).
        calling_party:
          type: array
          items:
            type: string
          description: The identities asserted for the caller (§5.1.3.1.24).
        caller_impi:
          type: string
          description: The private identity of the caller's registration (§5.1.3.1.36).
        requested_party:
          type: string
          description: The Request-URI the caller sent (§5.1.3.1.43).
        called_party:
          type: string
          description: The Request-URI the IMS routed the call to, normalised (§5.1.3.1.9).
        callee_impi:
          type: string
          description: The private identity of the registration that answered (§5.1.3.1.36).
        requested_at:
          type: string
          format: date-time
          description: When the IMS received the INVITE (§5.1.3.1.58).
        delivery_start_at:
          type: string
          format: date-time
          description: When the caller got the final response, a 2xx or an error (§5.1.3.1.55).
        delivery_end_at:
          type: string
          format: date-time
          description: When an answered call ended (§5.1.3.1.54).
        sip_status:
          type: integer
          description: The final status of the INVITE, as the caller got it.
        outcome:
          $ref: "#/components/schemas/CallOutcome"
        ended_by:
          type: string
          enum: [caller, callee, network]
        alerted:
          type: boolean
          description: A device rang, a 180 reached the caller.
        media:
          type: array
          items:
            type: string
          description: The media types the call used, such as audio and video.
        in_progress:
          type: boolean
          description: The call has not ended.
        incomplete:
          type: boolean
          description: The IMS lost the call, in a restart, before it ended.
        duration_ms:
          type: integer
          description: How long an answered call that ended lasted, in milliseconds.

    CallRecordRetention:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650

    CallRecordRetentionResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CallRecordRetention"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: object
                properties:
                  message:
                    type: string
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with other settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
