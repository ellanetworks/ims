name: Image Publish

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      release:
        description: Tag the image with version/VERSION instead of sha-<commit>.
        type: boolean
        required: true
      artifact:
        description: Prefix of the image artifacts, one per architecture.
        type: string
        default: ellaims-image
      tag-suffix:
        description: Suffix appended to every tag, e.g. -ubi.
        type: string
        default: ""

jobs:
  publish-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}-${{ matrix.arch }}

      - name: Import and push to github package (${{ matrix.arch }})
        env:
          SUFFIX: ${{ inputs.tag-suffix }}
        run: |
          tag="sha-${GITHUB_SHA::12}${SUFFIX}"
          if [ "${{ inputs.release }}" = true ]; then
            tag="$(cat version/VERSION)${SUFFIX}"
          fi

          docker load -i ellaims_latest-${{ matrix.arch }}.tar

          docker tag ella-ims:latest ghcr.io/ellanetworks/ella-ims:${tag}-${{ matrix.arch }}

          docker push ghcr.io/ellanetworks/ella-ims:${tag}-${{ matrix.arch }}

  make-manifest:
    needs: publish-image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          SUFFIX: ${{ inputs.tag-suffix }}
        run: |
          version="$(cat version/VERSION)"
          if [ "${{ inputs.release }}" = true ]; then
            tag="${version}${SUFFIX}"
            tags=("${tag}" "latest${SUFFIX}")
            if [ -n "${SUFFIX}" ]; then
              tags+=("${version%.*}${SUFFIX}")
            fi
          else
            tag="sha-${GITHUB_SHA::12}${SUFFIX}"
            if [ -n "${SUFFIX}" ]; then
              tags=("${tag}" "main${SUFFIX}")
            else
              tags=("${tag}" latest)
            fi
          fi

          for t in "${tags[@]}"; do
            docker manifest create ghcr.io/ellanetworks/ella-ims:${t} \
              ghcr.io/ellanetworks/ella-ims:${tag}-amd64 \
              ghcr.io/ellanetworks/ella-ims:${tag}-arm64
            docker manifest push ghcr.io/ellanetworks/ella-ims:${t}
          done
