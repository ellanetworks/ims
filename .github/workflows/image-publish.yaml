name: Image Publish

permissions:
  contents: read
  packages: write

on:
  workflow_call:

jobs:
  publish-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: ellaims-image-${{ matrix.arch }}

      - name: Import and push to github package (${{ matrix.arch }})
        run: |
          tag="sha-${GITHUB_SHA::12}"

          docker load -i ellaims_latest-${{ matrix.arch }}.tar

          docker tag ella-ims:latest ghcr.io/ellanetworks/ella-ims:${tag}-${{ matrix.arch }}

          docker push ghcr.io/ellanetworks/ella-ims:${tag}-${{ matrix.arch }}

  make-manifest:
    needs: publish-image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          tag="sha-${GITHUB_SHA::12}"

          docker manifest create ghcr.io/ellanetworks/ella-ims:${tag} \
            ghcr.io/ellanetworks/ella-ims:${tag}-amd64 \
            ghcr.io/ellanetworks/ella-ims:${tag}-arm64

          docker manifest create ghcr.io/ellanetworks/ella-ims:latest \
            ghcr.io/ellanetworks/ella-ims:${tag}-amd64 \
            ghcr.io/ellanetworks/ella-ims:${tag}-arm64

          docker manifest push ghcr.io/ellanetworks/ella-ims:${tag}
          docker manifest push ghcr.io/ellanetworks/ella-ims:latest
