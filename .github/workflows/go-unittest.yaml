name: Go Unit Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  go-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            sip/go.sum

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests
        run: go test -race -cover ./...

      # The app binds mcptt/mobile (android/), which must not carry the database (SQLite, cgo) into the APK.
      - name: Check that the mobile library does not link the database
        run: |
          if go list -deps ./mcptt/mobile ./mcptt/client | grep -E 'internal/db|go-sqlite3'; then
            echo "::error::mobile links the database"
            exit 1
          fi

      - name: Sub-module unit tests
        run: |
          set -e
          for modfile in $(find . -name go.mod -not -path './go.mod' -not -path './ui/*'); do
            dir=$(dirname "$modfile")
            echo "::group::go test ./... in $dir"
            (cd "$dir" && go test -race -cover ./...)
            echo "::endgroup::"
          done
