name: E2E Tests

permissions:
  contents: read
  packages: read

on:
  workflow_call:

jobs:
  e2e-open5gs:
    name: e2e-open5gs (${{ matrix.rat }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rat: [4g, 5g]
    env:
      E2E_RAT: ${{ matrix.rat }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load kernel modules
        run: sudo modprobe -a sctp esp4 xfrm_user

      - name: Start Open5GS, Ella IMS and the RAN simulator
        run: ./up.sh

      - name: Run E2E tests
        run: ./run.sh

      - name: Dump logs
        if: failure()
        run: |
          . ./env.sh
          docker compose ps -a
          docker compose logs --no-color --timestamps
          docker compose exec -T open5gs sh -c 'tail -n 300 /var/log/open5gs/*.log' || true

      - name: Stop
        if: always()
        run: . ./env.sh && docker compose down -t 5
