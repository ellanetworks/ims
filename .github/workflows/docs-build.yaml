name: Docs Build

permissions:
  contents: read

on:
  workflow_call:

jobs:
  docs-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
