name: Image Build

permissions:
  contents: read

on:
  workflow_call:

jobs:
  build-image:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-26.04-arm') || 'ubuntu-26.04' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: canonical/craft-actions/rockcraft/pack@c0a51ebfb8e6479f8f5d6b381614c22405916b17 # main
        id: rockcraft
        with:
          channel: stable

      - name: Save container image to file
        run: |
          rock_file=$(ls *.rock | tail -n 1)
          sudo rockcraft.skopeo --insecure-policy copy oci-archive:"${rock_file}" docker-daemon:ella-ims:latest
          docker save -o ellaims_latest-${{ matrix.arch }}.tar ella-ims:latest

      - name: Upload container image to GitHub Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ellaims-image-${{ matrix.arch }}
          path: ellaims_latest-${{ matrix.arch }}.tar
