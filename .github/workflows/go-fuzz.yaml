name: Go Fuzz

permissions:
  contents: read

on:
  workflow_call:

jobs:
  go-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./, target: FuzzParse }
          - { package: ./, target: FuzzStream }
          - { package: ./, target: FuzzURI }
          - { package: ./, target: FuzzAddress }
          - { package: ./, target: FuzzVia }
          - { package: ./, target: FuzzAuth }
          - { package: ./, target: FuzzSecurityMechanism }
          - { package: ./, target: FuzzReason }
          - { package: ./, target: FuzzWarning }
          - { package: ./, target: FuzzPrivacy }
          - { package: ./, target: FuzzEarlyMedia }
          - { package: ./, target: FuzzMultipart }
          - { package: ./, target: FuzzFeatureSet }
          - { package: ./, target: FuzzTypedHeaders }
          - { package: ./sdp/, target: FuzzSDP }
          - { package: ./imsxml/, target: FuzzDecode }
          - { package: ./xmltree/, target: FuzzParse }
          - { package: ./pidf/, target: FuzzDecode }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            sip/go.sum

      - name: Fuzz ${{ matrix.package }} ${{ matrix.target }}
        working-directory: sip
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s ${{ matrix.package }}
