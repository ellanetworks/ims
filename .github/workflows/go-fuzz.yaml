name: Go Fuzz

permissions:
  contents: read

on:
  workflow_call:

jobs:
  go-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./, target: FuzzParse }
          - { package: ./, target: FuzzStream }
          - { package: ./, target: FuzzURI }
          - { package: ./, target: FuzzAddress }
          - { package: ./, target: FuzzVia }
          - { package: ./, target: FuzzAuth }
          - { package: ./, target: FuzzSecurityMechanism }
          - { package: ./, target: FuzzReason }
          - { package: ./, target: FuzzWarning }
          - { package: ./, target: FuzzPrivacy }
          - { package: ./, target: FuzzEarlyMedia }
          - { package: ./, target: FuzzMultipart }
          - { package: ./, target: FuzzFeatureSet }
          - { package: ./, target: FuzzTypedHeaders }
          - { package: ./sdp/, target: FuzzSDP }
          - { package: ./imsxml/, target: FuzzDecode }
          - { package: ./xmltree/, target: FuzzParse }
          - { package: ./xsd/, target: FuzzDateTime }
          - { package: ./pidf/, target: FuzzDecode }
          - { package: ./conferenceinfo/, target: FuzzDecode }
          - { package: ./resourcelists/, target: FuzzDecode }
          - { package: ./simplefilter/, target: FuzzDecode }
          - { package: ./pocsettings/, target: FuzzDecode }
          - { package: ./reginfo/, target: FuzzDecode }
          - { package: ./mcpttinfo/, target: FuzzMcpttInfo }
          - { package: ./pidfmc/, target: FuzzPidf }
          # The root module's: the MCPTT AS and client.
          - { module: ., package: ./mcptt/controlchannel/, target: FuzzFmtp }
          - { module: ., package: ./mcptt/rtp/, target: FuzzRTP }
          - { module: ., package: ./mcptt/rtp/, target: FuzzRTCP }
          - { module: ., package: ./mcptt/media/, target: FuzzRTCPSSRCs }
          - { module: ., package: ./mcptt/floorctl/, target: FuzzFloor }
          - { module: ., package: ./mcptt/floor/, target: FuzzServer }
          - { module: ., package: ./mcptt/amr/, target: FuzzParsePayload }
          - { module: ., package: ./internal/mcptt/settings/, target: FuzzSettings }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            sip/go.sum

      - name: Fuzz ${{ matrix.package }} ${{ matrix.target }}
        # The sip module's, unless module says otherwise.
        working-directory: ${{ matrix.module || 'sip' }}
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s ${{ matrix.package }}
