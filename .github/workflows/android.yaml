name: Android

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      MCPTT_KEYSTORE_BASE64:
        required: false
      MCPTT_KEYSTORE_PASSWORD:
        required: false
      MCPTT_KEY_ALIAS:
        required: false
      MCPTT_KEY_PASSWORD:
        required: false

jobs:
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Each build of main is a release, signed with the release key (android/README.md); pull requests build unsigned,
      # their code never with the key.
      SIGN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            sip/go.sum
      # A pull request builds the app only if it changes what the app is made of: the app, its version, the modules,
      # and the Go packages of the session it binds (mcptt/mobile and its imports); main always does.
      - name: Changes of the app
        id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deps="$(go list -deps -f '{{if not .Standard}}{{.Dir}}{{end}}' ./mcptt/mobile | sed "s#^$PWD/##")"
          for f in $(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD); do
            case "$f" in
            android/* | version/* | go.mod | go.sum | sip/go.mod | sip/go.sum) ;;
            *) grep -qxF "$(dirname "$f")" <<< "$deps" || continue ;;
            esac
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.changes.outputs.app == 'true'
      - name: Install the Android SDK platform and NDK
        if: steps.changes.outputs.app == 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          # Google's downloads fail now and then (a truncated archive): try again, and check what is installed.
          for attempt in 1 2 3; do
            "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" &&
              [ -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" ] &&
              [ -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] &&
              [ -x "$ANDROID_HOME/build-tools/37.0.0/apksigner" ] && exit 0
            echo "attempt $attempt failed"
            sleep $((attempt * 10))
          done
          exit 1
      # ktlint and the Compose rules; spotlessApply fixes the format. Before the release key: the key's
      # environment is only complete in the step that builds the release.
      - name: Check the Kotlin
        if: steps.changes.outputs.app == 'true'
        run: ./gradlew :app:spotlessCheck
      - name: Decode the release key
        if: steps.changes.outputs.app == 'true' && env.SIGN == 'true'
        env:
          MCPTT_KEYSTORE_BASE64: ${{ secrets.MCPTT_KEYSTORE_BASE64 }}
        run: |
          [ -n "$MCPTT_KEYSTORE_BASE64" ] || { echo "MCPTT_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$MCPTT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MCPTT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Lint, test and build
        if: steps.changes.outputs.app == 'true'
        env:
          MCPTT_KEYSTORE_PASSWORD: ${{ env.SIGN == 'true' && secrets.MCPTT_KEYSTORE_PASSWORD || '' }}
          MCPTT_KEY_ALIAS: ${{ env.SIGN == 'true' && secrets.MCPTT_KEY_ALIAS || '' }}
          MCPTT_KEY_PASSWORD: ${{ env.SIGN == 'true' && secrets.MCPTT_KEY_PASSWORD || '' }}
        run: ./gradlew -Pmcptt.build=${{ github.run_number }} :app:lint :app:verifyRoborazziDebug :app:assembleRelease
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the APK
        if: steps.changes.outputs.app == 'true'
        run: |
          bt="$ANDROID_HOME/build-tools/37.0.0"
          if [ "$SIGN" = true ]; then
            apk=app/build/outputs/apk/release/app-release.apk
            got="$("$bt/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-1 digest/ { print toupper($NF) }')"
            want="$(grep -v '^#' release-cert.sha1)"
            [ "$got" = "$want" ] || { echo "signed by $got, want $want (release-cert.sha1)"; exit 1; }
          else
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          # The native libraries stored uncompressed, at 16 KB pages, their LOAD segments aligned to them.
          "$bt/zipalign" -c -P 16 4 "$apk"
          unzip -o -q "$apk" 'lib/*' -d "$RUNNER_TEMP/apk"
          readelf="$(ls "$ANDROID_HOME"/ndk/28.2.13676358/toolchains/llvm/prebuilt/*/bin/llvm-readelf)"
          for so in "$RUNNER_TEMP"/apk/lib/*/*.so; do
            aligns="$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')"
            [ -n "$aligns" ] || { echo "$so: no LOAD segment"; exit 1; }
            for a in $aligns; do
              [ $((a)) -ge 16384 ] || { echo "$so: LOAD alignment $a"; exit 1; }
            done
          done
          name="ella-mcptt-$(cat ../version/VERSION)+${{ github.run_number }}"
          mkdir -p dist && cp "$apk" "dist/$name.apk"
          # R8's mapping, to deobfuscate the stack traces of this build.
          cp app/build/outputs/mapping/release/mapping.txt "dist/$name-mapping.txt"
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.app == 'true'
        with:
          name: ella-mcptt-apk
          path: android/dist/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          # The screenshots' differences of verifyRoborazziDebug among them.
          path: |
            android/app/build/reports
            android/app/build/outputs/roborazzi
