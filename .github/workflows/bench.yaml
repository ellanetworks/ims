name: MCPTT Benchmarks

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      # The load benchmarks of the MCPTT AS (internal/mcptt/bench_test.go). The group calls hold about 100,000 sockets:
      # the limit of open files raised for them.
      - name: Run benchmarks
        run: |
          set -o pipefail
          sudo prlimit --pid $$ --nofile=1048576:1048576
          go test ./internal/mcptt -run '^$' -bench '^BenchmarkRegistration$' -benchtime 2000x -count 10 -timeout 20m | tee new.txt
          go test ./internal/mcptt -run '^$' -bench '^BenchmarkGroupCalls$' -benchtime 1x -count 10 -timeout 40m | tee -a new.txt

      - name: Download the previous main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow bench.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name bench --dir previous || true
          fi

      - name: Compare with benchstat
        run: |
          if [ -f previous/new.txt ]; then
            go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e previous/new.txt new.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e new.txt | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: new.txt
          retention-days: 90
