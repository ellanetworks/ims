logger:
  file:
    path: /var/log/open5gs/nrf.log
nrf:
  # The NRF notifies the PCF of NF status changes directly, at its https server (pcf.yaml).
  default:
    tls:
      client:
        cacert: /etc/open5gs/n5-tls/ca.crt
        client_private_key: /etc/open5gs/n5-tls/nrf.key
        client_cert: /etc/open5gs/n5-tls/nrf.crt
  serving:
    - plmn_id:
        mcc: 001
        mnc: 01
  sbi:
    server:
      - address: 127.0.0.10
        port: 7777
