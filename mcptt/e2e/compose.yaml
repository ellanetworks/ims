# Open5GS (its HSS holding the MCPTT iFCs, provision.js) and Ella IMS, its built-in MCPTT AS the AS of the iFCs, on
# the addresses of Ella IMS's e2e (ims/e2e): the two setups do not run at the same time. The access network is in
# compose.4g.yaml or compose.5g.yaml, which env.sh selects.
name: mcptt-e2e

services:
  mongo:
    image: mongo:8.2
    networks:
      core:
        ipv4_address: 10.80.0.20

  open5gs:
    image: ghcr.io/ellanetworks/ella-mcptt-e2e-open5gs:${OPEN5GS_TAG:?run through env.sh or set OPEN5GS_TAG}
    build: ./open5gs
    privileged: true
    depends_on: [mongo]
    command: ["/start.sh"]
    volumes:
      - ./open5gs/start.sh:/start.sh:ro
      - ./open5gs/config/open5gs/nrf.yaml:/etc/open5gs/nrf.yaml:ro
      - ./open5gs/config/open5gs/smf.yaml:/etc/open5gs/smf.yaml:ro
      - ./open5gs/config/open5gs/hss.yaml:/etc/open5gs/hss.yaml:ro
      - ./open5gs/config/freeDiameter/hss.conf:/etc/freeDiameter/hss.conf:ro
      - ./tls:/etc/open5gs/n5-tls:ro
    networks:
      core:
        ipv4_address: 10.80.0.10
        driver_opts:
          com.docker.network.endpoint.ifname: eth0
      s1:
        ipv4_address: 10.80.1.10
        driver_opts:
          com.docker.network.endpoint.ifname: s1

  # Ella IMS, built from this tree or ELLA_IMS_SRC (env.sh), and its MCPTT AS: its SIP in memory, its media on
  # 10.80.0.5, through the route of ims-routes to the UEs.
  ims:
    image: ${ELLA_IMS_IMAGE:?run through env.sh or set ELLA_IMS_IMAGE}
    # The P-CSCF installs the IPsec SAs of the UEs (TS 33.203 §7).
    privileged: true
    depends_on: [open5gs]
    entrypoint: ["ims", "--config", "/ims.yaml"]
    ports:
      - "127.0.0.1:5020:5020"
    networks:
      core:
        ipv4_address: 10.80.0.5

  # The route of the IMS to the UEs, through the UPF: the image of Ella IMS has no shell.
  ims-routes:
    image: ghcr.io/ellanetworks/ubuntu-router:0.1
    network_mode: service:ims
    depends_on: [ims]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    command:
      - exec
      - /bin/bash
      - -c
      - ip -4 route replace 10.46.0.0/16 via 10.80.0.10 && trap 'exit 0' TERM INT && { sleep infinity & wait; }

networks:
  core:
    ipam:
      config:
        - subnet: 10.80.0.0/24
          ip_range: 10.80.0.128/25
  s1:
    internal: true
    ipam:
      config:
        - subnet: 10.80.1.0/24
