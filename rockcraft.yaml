name: ella-ims
base: bare
build-base: ubuntu@26.04
adopt-info: ims-release-data
summary: Ella IMS is a secure, reliable, and easy to operate IP Multimedia Subsystem.
description: |
 Ella IMS is a secure, reliable, and easy to operate IP Multimedia Subsystem.
platforms:
  amd64:
  arm64:

services:
  ella-ims:
    override: replace
    summary: Ella IMS is a secure, reliable, and easy to operate IP Multimedia Subsystem.
    command: ims --config /ims.yaml
    startup: enabled
    on-failure: restart

parts:
  core:
    plugin: go
    source: .
    source-type: local
    build-packages:
      - git
    build-snaps:
      - go/1.26/stable
      - node/24/stable
    stage-packages:
      - libc6_libs
    override-build: |
      npm ci --prefix ui
      npm run build --prefix ui
      REVISION=`git rev-parse HEAD`
      go build -v -o ${CRAFT_PART_INSTALL}/bin/ims -ldflags "-s -w -X github.com/ellanetworks/ims/version.GitCommit=${REVISION}" ./cmd/ims

  ims-release-data:
    plugin: nil
    source: .
    override-build: |
      version="$(cat version/VERSION)"
      craftctl set version="$version"
