apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ella
resources:
  - ../../../k8s/ha
  - ims-sip-nad.yaml
images:
  - name: ghcr.io/ellanetworks/ella-ims
    newName: ella-ims
    newTag: ci
patches:
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ella-ims
      spec:
        template:
          metadata:
            annotations:
              k8s.v1.cni.cncf.io/networks: |
                [
                  {"name": "ims-sip", "interface": "eth1"}
                ]
