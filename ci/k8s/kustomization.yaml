# The manifests of k8s as the smoke test deploys them, in a namespace that
# allows the NET_ADMIN capability of IPsec, with the image it loads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../k8s
images:
  - name: ghcr.io/ellanetworks/ella-ims
    newName: ella-ims
    newTag: ci
