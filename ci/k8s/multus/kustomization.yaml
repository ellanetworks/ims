apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace
  - ../../../k8s/examples/multus
images:
  - name: ghcr.io/ellanetworks/ella-ims
    newName: ella-ims
    newTag: ci
patches:
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ella-ims
      spec:
        type: NodePort
        externalTrafficPolicy: Local
