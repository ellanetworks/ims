{{- if and (include "ella-ims.ha" .) .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ella-ims.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-ims.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ella-ims.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ella-ims.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7000
    - ports:
        - protocol: TCP
          port: 1
          endPort: 6999
        - protocol: TCP
          port: 7001
          endPort: 65535
        - protocol: UDP
          port: 1
          endPort: 65535
        - protocol: SCTP
          port: 1
          endPort: 65535
{{- end }}
