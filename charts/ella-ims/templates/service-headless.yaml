apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-ims.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-ims.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ella-ims.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 5020
      targetPort: http
    {{- if include "ella-ims.ha" . }}
    - name: tcp-cluster
      protocol: TCP
      port: 7000
      targetPort: tcp-cluster
    {{- end }}
