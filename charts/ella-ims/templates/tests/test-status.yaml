apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ella-ims.fullname" . }}-test-status
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ include "ella-ims.chart" . }}
    app.kubernetes.io/name: {{ include "ella-ims.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: status
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://{{ include "ella-ims.fullname" . }}:{{ .Values.service.port }}/api/v1/status"]
      terminationMessagePolicy: FallbackToLogsOnError
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
