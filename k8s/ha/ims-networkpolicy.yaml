apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ella-ims
  labels:
    app.kubernetes.io/name: ella-ims
    app.kubernetes.io/instance: ella-ims
    app.kubernetes.io/part-of: ella
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ella-ims
      app.kubernetes.io/instance: ella-ims
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ella-ims
          app.kubernetes.io/instance: ella-ims
    ports:
    - protocol: TCP
      port: 7000
  - ports:
    - protocol: TCP
      port: 1
      endPort: 6999
    - protocol: TCP
      port: 7001
      endPort: 65535
    - protocol: UDP
      port: 1
      endPort: 65535
    - protocol: SCTP
      port: 1
      endPort: 65535
