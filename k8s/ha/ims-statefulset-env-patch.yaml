- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: IMS_CLUSTER_ADVERTISE
    value: $(POD_NAME).ella-ims-internal.$(POD_NAMESPACE).svc.cluster.local:7000
