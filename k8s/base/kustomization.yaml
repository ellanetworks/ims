apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ims-statefulset.yaml
  - ims-service.yaml
configMapGenerator:
  - name: ims-config
    files:
      - ims.yaml
    options:
      labels:
        app.kubernetes.io/name: ella-ims
        app.kubernetes.io/instance: ella-ims
        app.kubernetes.io/part-of: ella
