apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ella-ims
  labels:
    app.kubernetes.io/name: ella-ims
    app.kubernetes.io/instance: ella-ims
    app.kubernetes.io/part-of: ella
spec:
  replicas: 1
  serviceName: ella-ims
  selector:
    matchLabels:
      app.kubernetes.io/name: ella-ims
      app.kubernetes.io/instance: ella-ims
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ella-ims
        app.kubernetes.io/instance: ella-ims
        app.kubernetes.io/part-of: ella
    spec:
      terminationGracePeriodSeconds: 37
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ims
        image: ghcr.io/ellanetworks/ella-ims:sha-fec62f8b4f54
        command: ["ims"]
        args: ["--config", "/config/ims.yaml"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: IMS_DIAMETER_HOST_LABEL
          value: $(POD_NAME)
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
        ports:
        - name: http
          containerPort: 5020
        startupProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 150
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: "16"
            memory: 1Gi
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: ims-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
