apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ella-ims
spec:
  replicas: 1
  serviceName: ella-ims
  selector:
    matchLabels:
      app: ella-ims
  template:
    metadata:
      labels:
        app: ella-ims
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ims
        image: ghcr.io/ellanetworks/ella-ims:latest
        command: ["ims"]
        args: ["--config", "/config/ims.yaml"]
        # The P-CSCF sets up IPsec with the phones in the kernel, which takes
        # CAP_NET_ADMIN, and root, to which Kubernetes gives added capabilities.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
        # SIP, Diameter and N5 are on the addresses of the configuration, not
        # behind a Service: see the connectivity reference.
        ports:
        - name: http
          containerPort: 5020
        startupProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 150
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: ims-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
